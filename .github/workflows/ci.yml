name: CI

# Every pull request into master is tested, test-built, typechecked and linted, then deployed to Cloudflare and the
# address is posted on the PR. The oldest open PR holds staging (staging.mybookie.pages.dev); every other PR gets a
# throwaway preview address under its branch name. Once something lands on master (a merge or a direct push) and
# the tests and build pass, that same build is deployed to production on Cloudflare (mybookie.pages.dev). The old
# address on Expo (bookie.expo.app) is frozen on its last deploy, which points people here: see the README.
#
# The jobs are separate so they can be treated differently when approving a PR. Tests and Build should be required
# checks; Typecheck & lint is advisory (it still shows a red cross when it fails, but doesn't have to block).
# Which checks are required is a setting on GitHub, not in this file: see "Continuous integration" in the README.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on master half way through a production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT: mybookie
  WRANGLER: wrangler@4.161.0

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npx jest --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Google Books key is optional: without it (or on PRs from
      # forks, which can't read secrets) the app falls back to Open Library alone.
      - name: Build web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}

      # Handed to the preview and deploy jobs so they ship exactly what was just built.
      - name: Keep the build for deploying
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 1
          if-no-files-found: error

  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs even if the typecheck failed, so one run reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx expo lint

  preview:
    name: Preview deploy
    # Needs only the build: a preview is still worth having while tests or the typecheck are failing.
    needs: build
    # Only for PRs from this repo: forks can't read the Cloudflare token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare settings
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice title=No preview::Add a CLOUDFLARE_API_TOKEN secret and a CLOUDFLARE_ACCOUNT_ID variable to get a preview deployment on each pull request."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          name: web-build
          path: dist

      # Cloudflare skips node_modules folders, where Expo puts SQLite's .wasm: see scripts/prepare-cloudflare.mjs.
      - name: Ready the build for Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/prepare-cloudflare.mjs dist

      # The oldest open PR into master (drafts included, forks left out as above) holds staging; every other PR is
      # deployed under its own branch name, so it keeps one address that updates with every push. Nothing happens when
      # the holder closes: staging keeps its last build until the next oldest PR pushes and takes it over.
      # Two PRs can only both deploy to staging if the holder closes while the next one's run is already past this
      # step. Then the later deploy wins and the next push puts it right, so there's no shared concurrency group
      # (one would queue every PR's preview behind the others and cancel the queued ones).
      - name: Choose staging or a preview
        id: target
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'master', sort: 'created', direction: 'asc', per_page: 100,
            });
            // head.repo is null when a fork has been deleted. This PR is open, so it's normally in the list; if it
            // somehow isn't, it gets a preview rather than risk taking staging from the real holder.
            const oldest = pulls.find((p) => p.head.repo && p.head.repo.full_name === `${owner}/${repo}`);
            const holdsStaging = oldest !== undefined && oldest.number === context.issue.number;
            // A branch that's literally called staging would land on staging, so it's deployed as pr-<number>.
            const own = process.env.HEAD_BRANCH === 'staging' ? `pr-${context.issue.number}` : process.env.HEAD_BRANCH;
            core.setOutput('branch', holdsStaging ? 'staging' : own);
            core.setOutput('staging', holdsStaging ? 'true' : 'false');
            core.setOutput('holder', oldest ? String(oldest.number) : '');

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name "$CLOUDFLARE_PROJECT" --branch "$BRANCH" --commit-dirty=true
          result=$(jq -c 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          echo "url=$(echo "$result" | jq -r '.url')" >> "$GITHUB_OUTPUT"
          echo "alias=$(echo "$result" | jq -r '.alias // .url')" >> "$GITHUB_OUTPUT"

      - name: Post the address on the PR
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.alias }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          HOLDS_STAGING: ${{ steps.target.outputs.staging }}
          STAGING_HOLDER: ${{ steps.target.outputs.holder }}
        with:
          script: |
            const marker = '<!-- bookie-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const where = process.env.HOLDS_STAGING === 'true'
              ? '**Staging:** https://staging.mybookie.pages.dev — this is the oldest open PR, so it holds staging.'
              : process.env.STAGING_HOLDER
                ? `**Preview:** ${process.env.PREVIEW_URL} — staging is held by #${process.env.STAGING_HOLDER} (the oldest open PR).`
                : `**Preview:** ${process.env.PREVIEW_URL}`;
            // A library lives in the browser, per address, so staging's is shared by every PR that has held it.
            const library = process.env.HOLDS_STAGING === 'true'
              ? "Staging's library is shared with earlier PRs that held staging, and is separate from the live app."
              : 'It has its own empty library, separate from the live app.';
            const body = [
              marker,
              where,
              '',
              `Built from ${sha} ([this build](${process.env.DEPLOYMENT_URL})). ${library}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    name: Deploy to production
    # Only after the tests and the build pass, and only for commits that land on master.
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare settings
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning title=Not deployed to Cloudflare::Add a CLOUDFLARE_API_TOKEN secret and a CLOUDFLARE_ACCOUNT_ID variable to deploy to production from GitHub."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      # Cloudflare skips node_modules folders, where Expo puts SQLite's .wasm: see scripts/prepare-cloudflare.mjs.
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          node scripts/prepare-cloudflare.mjs dist
          npx --yes "$WRANGLER" pages deploy dist --project-name "$CLOUDFLARE_PROJECT" --branch master --commit-dirty=true
