name: CI

# Every pull request into master is tested, test-built, typechecked and linted, then deployed to a throwaway
# preview address that's posted on the PR. Once something lands on master (a merge or a direct push) and the tests
# and build pass, that same build is deployed to production.
#
# The jobs are separate so they can be treated differently when approving a PR. Tests and Build should be required
# checks; Typecheck & lint is advisory (it still shows a red cross when it fails, but doesn't have to block).
# Which checks are required is a setting on GitHub, not in this file: see "Continuous integration" in the README.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on master half way through a production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npx jest --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Google Books key is optional: without it (or on PRs from
      # forks, which can't read secrets) the app falls back to Open Library alone.
      - name: Build web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}

      # Handed to the preview and deploy jobs so they ship exactly what was just built.
      - name: Keep the build for deploying
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          retention-days: 1
          if-no-files-found: error

  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs even if the typecheck failed, so one run reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx expo lint

  preview:
    name: Preview deploy
    # Needs only the build: a preview is still worth having while tests or the typecheck are failing.
    needs: build
    # Only for PRs from this repo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for an Expo token
        if: env.EXPO_TOKEN == ''
        run: echo "::notice title=No preview::Add an EXPO_TOKEN repository secret to get a preview deployment on each pull request."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - uses: actions/download-artifact@v4
        if: env.EXPO_TOKEN != ''
        with:
          name: web-build
          path: dist

      # Deploy preview build
      - name: Deploy preview
        id: deploy
        if: env.EXPO_TOKEN != ''
        run: |
          npx --yes eas-cli@27.7.1 deploy --json > deploy.json
          cat deploy.json
          echo "url=$(jq -r .url deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Post the preview address on the PR
        if: env.EXPO_TOKEN != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- bookie-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${sha}. It has its own empty library, separate from the live app. Removed automatically after 30 days.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    name: Deploy to production
    # Only after the tests and the build pass, and only for commits that land on master.
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for an Expo token
        if: env.EXPO_TOKEN == ''
        run: echo "::warning title=Not deployed::Add an EXPO_TOKEN repository secret to deploy to production from GitHub."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - uses: actions/download-artifact@v4
        if: env.EXPO_TOKEN != ''
        with:
          name: web-build
          path: dist

      - name: Deploy to production
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@27.7.1 deploy --prod
